<!DOCTYPE html>
<html lang="sk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Môj test</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 20px;
            background: #f5f5f5;
        }

        .app {
            max-width: 800px;
            margin: 0 auto;
            background: white;
            padding: 25px;
            border-radius: 15px;
        }

        h1 {
            text-align: center;
        }

        button {
            padding: 12px 20px;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-size: 16px;
        }

        @media (max-width: 600px) {
            body {
                padding: 10px;
            }

            .app {
                padding: 15px;
            }
        }
    </style>
</head>

<body>

<div class="app">
    <h1>📚 Môj test</h1>

    <p>
        Tu bude neskôr tvoja databáza otázok a celý test.
    </p>

    <button>Začať test</button>
</div>

</body>
</html>
